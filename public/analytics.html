<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth-nav.js"></script>
<script src="/js/nav-dropdown.js"></script>
<script src="/js/theme-toggle.js"></script>
<script>
  const content = document.getElementById('content');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function pct(n) { return Math.round(n * 100); }
  function barColor(p) {
    if (p >= 75) return '#86efac';
    if (p >= 50) return '#fde047';
    return '#fca5a5';
  }

  function gateHtml(title, message, ctaText, ctaHref) {
    return '<div class="gate-note" style="margin:70px auto"><h2>' + escapeHtml(title) + '</h2><p>' +
      escapeHtml(message) + '</p><a class="auth-submit" style="display:inline-block;width:auto;padding:11px 26px;text-decoration:none" href="' +
      ctaHref + '">' + escapeHtml(ctaText) + '</a></div>';
  }

  function barRow(label, p, sub, link) {
    return '<div style="margin-bottom:16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">' +
        '<span style="font-weight:700;font-size:14.5px">' + escapeHtml(label) + '</span>' +
        '<span style="font-size:12.5px;color:var(--subtext)">' + escapeHtml(sub) + '</span>' +
      '</div>' +
      '<div style="background:var(--pill);border-radius:9999px;height:10px;overflow:hidden">' +
        '<div style="width:' + p + '%;height:100%;background:' + barColor(p) + ';border-radius:9999px"></div>' +
      '</div>' +
      (link ? '<a href="' + link + '" style="display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:#7fb3ff">Practice this →</a>' : '') +
    '</div>';
  }

  async function render() {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData.session) {
      content.innerHTML = gateHtml(
        'Log in to see your Insights',
        'Insights analyzes every test you\'ve completed to show your weakest question types and sections.',
        'Log in / Sign up', '/login.html?next=/analytics.html'
      );
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles').select('is_premium').eq('id', sessionData.session.user.id).maybeSingle();
    if (!profile || !profile.is_premium) {
      content.innerHTML = gateHtml(
        'Insights is a Premium feature ✨',
        'See exactly which question types and sections are costing you marks, with direct links to targeted practice.',
        'Get Premium', '/premium.html'
      );
      return;
    }

    const [{ data: attempts, error }, manifest] = await Promise.all([
      supabaseClient.from('test_attempts').select('*').order('completed_at', { ascending: false }),
      fetch('/data/tests.json').then((r) => r.json()),
    ]);

    if (error) {
      content.innerHTML = '<div class="gate-note" style="margin:70px auto"><h2>Couldn\'t load your data</h2><p>' + escapeHtml(error.message) + '</p></div>';
      return;
    }

    if (!attempts || !attempts.length) {
      content.innerHTML =
        '<div class="page-wrap"><h1>Your Insights ✨</h1><p class="page-sub">Personalized analysis based on every test you complete.</p>' +
        '<div class="gate-note"><h2>No attempts yet</h2><p>Complete a few tests and come back — this page fills in automatically.</p></div></div>';
      return;
    }

    const fileToTest = {};
    manifest.forEach((t) => { if (t.file) fileToTest['/tests/' + t.file] = t; });

    const bySection = { reading: { sum: 0, count: 0 }, listening: { sum: 0, count: 0 } };
    const byType = {};
    let overallSum = 0, overallCount = 0;

    attempts.forEach((a) => {
      if (!a.total) return;
      const p = a.score / a.total;
      overallSum += p; overallCount++;
      if (bySection[a.section]) { bySection[a.section].sum += p; bySection[a.section].count++; }
      const test = fileToTest[a.test_path];
      if (test && test.questionTypes) {
        test.questionTypes.forEach((qt) => {
          if (!byType[qt]) byType[qt] = { sum: 0, count: 0 };
          byType[qt].sum += p; byType[qt].count++;
        });
      }
    });

    const overallPct = overallCount ? pct(overallSum / overallCount) : 0;
    const readingPct = bySection.reading.count ? pct(bySection.reading.sum / bySection.reading.count) : null;
    const listeningPct = bySection.listening.count ? pct(bySection.listening.sum / bySection.listening.count) : null;

    const typeRows = Object.keys(byType)
      .map((qt) => ({ qt, pct: pct(byType[qt].sum / byType[qt].count), count: byType[qt].count }))
      .sort((a, b) => a.pct - b.pct);

    let html = '<div class="page-wrap"><h1>Your Insights ✨</h1><p class="page-sub">Personalized analysis based on every test you\'ve completed.</p>';

    html += '<div class="summary-row">' +
      '<div class="stat-box"><div class="num">' + attempts.length + '</div><div class="lbl">Tests completed</div></div>' +
      '<div class="stat-box"><div class="num">' + overallPct + '%</div><div class="lbl">Overall average</div></div>' +
      '<div class="stat-box"><div class="num">' + (readingPct === null ? '–' : readingPct + '%') + '</div><div class="lbl">Reading average</div></div>' +
      '<div class="stat-box"><div class="num">' + (listeningPct === null ? '–' : listeningPct + '%') + '</div><div class="lbl">Listening average</div></div>' +
      '</div>';

    // Suggestions — plain-language summary generated from the numbers above, never fabricated.
    const suggestions = [];
    if (readingPct !== null && listeningPct !== null) {
      if (Math.abs(readingPct - listeningPct) >= 5) {
        const weaker = readingPct < listeningPct ? 'Reading' : 'Listening';
        const weakerPct = Math.min(readingPct, listeningPct);
        suggestions.push('Your ' + weaker + ' average (' + weakerPct + '%) is noticeably behind your other section — worth spending more practice time there.');
      } else {
        suggestions.push('Your Reading and Listening averages are close (' + readingPct + '% vs ' + listeningPct + '%) — fairly balanced so far.');
      }
    }
    if (typeRows.length) {
      const weakest = typeRows[0];
      suggestions.push('Across Reading question types, <strong>' + escapeHtml(weakest.qt) + '</strong> is your weakest at ' + weakest.pct + '% (based on ' + weakest.count + ' test' + (weakest.count === 1 ? '' : 's') + ') — the practice link below jumps straight to more of it.');
    }

    if (suggestions.length) {
      html += '<div class="gate-note" style="margin:0 0 30px;text-align:left"><h2 style="margin-bottom:10px">Suggestions</h2>' +
        suggestions.map((s) => '<p style="margin:0 0 8px">' + s + '</p>').join('') + '</div>';
    }

    if (typeRows.length) {
      html += '<h2 style="font-size:16px;margin:0 0 14px;color:var(--subtext);text-transform:uppercase;letter-spacing:.4px;font-weight:800">Reading — by question type</h2>';
      html += '<div style="margin-bottom:30px">' +
        typeRows.map((r) => barRow(
          r.qt, r.pct, r.pct + '% avg · ' + r.count + ' test' + (r.count === 1 ? '' : 's'),
          '/reading.html?qtype=' + encodeURIComponent(r.qt)
        )).join('') +
        '</div>';
    } else {
      html += '<div class="gate-note"><h2>No Reading data yet</h2><p>Complete a Reading test to see a question-type breakdown here.</p></div>';
    }

    html += '</div>';
    content.innerHTML = html;
  }

  render();
</script>
</body>
</html>
