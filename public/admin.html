<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth-nav.js"></script>
<script src="/js/nav-dropdown.js"></script>
<script src="/js/theme-toggle.js"></script>
<script src="/js/ielts-band.js"></script>
<script>
  const content = document.getElementById('content');

  function scoreClass(score, total) {
    const pct = total ? score / total : 0;
    if (pct >= 0.75) return 'good';
    if (pct >= 0.5) return 'mid';
    return 'low';
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function notAuthorized(message) {
    content.innerHTML = '<div class="gate-note"><h2>Not authorized</h2><p>' + escapeHtml(message) +
      '</p><a class="auth-submit" style="display:inline-block;width:auto;padding:11px 26px;text-decoration:none" href="/">Back to home</a></div>';
  }

  async function render() {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData.session) { notAuthorized('Log in with an admin account to view this page.'); return; }

    const { data: profile, error: profileErr } = await supabaseClient
      .from('profiles').select('role').eq('id', sessionData.session.user.id).maybeSingle();
    if (profileErr || !profile || profile.role !== 'admin') {
      notAuthorized('This page is only visible to the site admin.');
      return;
    }

    const [{ data: attempts, error: attemptsErr }, { data: profiles, error: profilesErr }] = await Promise.all([
      supabaseClient.from('test_attempts').select('*').order('completed_at', { ascending: false }),
      supabaseClient.from('profiles').select('id, email, role, is_premium, created_at'),
    ]);
    if (attemptsErr || profilesErr) {
      content.innerHTML = '<div class="gate-note"><h2>Couldn\'t load data</h2><p>' +
        escapeHtml((attemptsErr || profilesErr).message) + '</p></div>';
      return;
    }

    const totalUsers = profiles.length;
    const totalAttempts = attempts.length;
    const avgPct = totalAttempts
      ? Math.round(attempts.reduce((s, a) => s + (a.total ? a.score / a.total : 0), 0) / totalAttempts * 100)
      : 0;

    // --- Per-user progress (mirrors what each student sees on their own My Progress) ---
    const byUser = {};
    attempts.forEach((a) => {
      if (!byUser[a.user_id]) byUser[a.user_id] = [];
      byUser[a.user_id].push(a);
    });

    const rows = profiles.map((p) => {
      const userAttempts = byUser[p.id] || [];
      const testsCount = userAttempts.length;
      const avgScorePct = testsCount
        ? Math.round(userAttempts.reduce((s, a) => s + (a.total ? a.score / a.total : 0), 0) / testsCount * 100)
        : null;
      const banded = userAttempts
        .map((a) => window.ieltsBand(a.score, a.total))
        .filter((b) => b !== null);
      const avgBand = banded.length ? (banded.reduce((s, b) => s + b, 0) / banded.length) : null;
      const bestBand = banded.length ? Math.max(...banded) : null;
      return { profile: p, testsCount, avgScorePct, avgBand, bestBand };
    });

    // Ranking: best band descending: no-data users sink to the bottom, unranked.
    rows.sort((a, b) => (b.bestBand || -1) - (a.bestBand || -1));
    let rank = 0;

    let html = '<div class="page-wrap"><h1>Admin Dashboard</h1><p class="page-sub">Every student\'s progress, ranked by their best band score.</p>';
    html += '<div class="summary-row">' +
      '<div class="stat-box"><div class="num">' + totalUsers + '</div><div class="lbl">Registered users</div></div>' +
      '<div class="stat-box"><div class="num">' + totalAttempts + '</div><div class="lbl">Tests completed</div></div>' +
      '<div class="stat-box"><div class="num">' + avgPct + '%</div><div class="lbl">Average score (all students)</div></div>' +
      '</div>';

    html += '<h2 style="font-size:16px;margin:0 0 12px;color:var(--subtext);text-transform:uppercase;letter-spacing:.4px;font-weight:800">Students — ranked by best band</h2>';
    html += '<table class="data-table" style="margin-bottom:34px"><thead><tr>' +
      '<th>#</th><th>Email</th><th>Premium</th><th>Tests</th><th>Avg score</th><th>Avg band</th><th>Best band</th><th>Best mock</th><th>Joined</th><th></th>' +
      '</tr></thead><tbody>';
    rows.forEach((r) => {
      const p = r.profile;
      if (r.bestBand !== null) rank++;
      html += '<tr>' +
        '<td>' + (r.bestBand !== null ? rank : '–') + '</td>' +
        '<td>' + escapeHtml(p.email) + (p.role === 'admin' ? ' <span class="score-pill mid">admin</span>' : '') + '</td>' +
        '<td><span class="score-pill ' + (p.is_premium ? 'good' : 'low') + '">' + (p.is_premium ? 'Yes' : 'No') + '</span></td>' +
        '<td>' + r.testsCount + '</td>' +
        '<td>' + (r.avgScorePct === null ? '–' : r.avgScorePct + '%') + '</td>' +
        '<td>' + (r.avgBand === null ? '–' : r.avgBand.toFixed(1)) + '</td>' +
        '<td>' + (r.bestBand === null ? '–' : '<span class="score-pill good">' + r.bestBand + '</span>') + '</td>' +
        '<td style="color:var(--subtext)">Coming soon</td>' +
        '<td>' + fmtDate(p.created_at) + '</td>' +
        '<td style="white-space:nowrap">' +
        '<a class="nav-link-sm" href="/progress.html?user=' + encodeURIComponent(p.id) + '" style="margin-right:10px">View Progress</a>' +
        '<button class="btn-logout premium-toggle" data-id="' + p.id + '" data-current="' + (p.is_premium ? '1' : '0') + '" type="button">' +
        (p.is_premium ? 'Revoke Premium' : 'Grant Premium') + '</button></td></tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
    content.innerHTML = html;

    content.querySelectorAll('.premium-toggle').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const nextValue = btn.dataset.current !== '1';
        btn.disabled = true; btn.textContent = 'Saving…';
        const { error } = await supabaseClient.from('profiles').update({ is_premium: nextValue }).eq('id', id);
        if (error) {
          btn.disabled = false; btn.textContent = 'Failed — retry';
          console.error(error);
          return;
        }
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
