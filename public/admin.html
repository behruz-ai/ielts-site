<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — Bekhruz IELTS</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<header class="site-hdr">
  <div class="hdr-inner">
    <a class="brand" href="/"><span class="brand-mark">Bekhruz</span> IELTS</a>
    <nav class="main-nav">
      <a href="/">Home</a>
      <a href="/reading.html">Reading</a>
      <a href="/listening.html">Listening</a>
    </nav>
    <div class="hdr-actions">
      <a class="tg-follow" href="https://t.me/bekhruzposts" target="_blank" rel="noopener">📣 @bekhruzposts</a>
      <span id="auth-slot"><a class="btn-login" href="/login.html">Log in</a></span>
    </div>
  </div>
</header>

<div id="content">
  <div class="gate-note" id="loading-note"><p>Loading…</p></div>
</div>

<footer class="site-ftr">
  &copy; 2026 Bekhruz IELTS · Prepared by I. Bekhruz · <a href="https://t.me/bekhruzposts" target="_blank" rel="noopener">Follow on Telegram</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth-nav.js"></script>
<script>
  const content = document.getElementById('content');

  function scoreClass(score, total) {
    const pct = total ? score / total : 0;
    if (pct >= 0.75) return 'good';
    if (pct >= 0.5) return 'mid';
    return 'low';
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function notAuthorized(message) {
    content.innerHTML = '<div class="gate-note"><h2>Not authorized</h2><p>' + escapeHtml(message) +
      '</p><a class="auth-submit" style="display:inline-block;width:auto;padding:11px 26px;text-decoration:none" href="/">Back to home</a></div>';
  }

  async function render() {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData.session) { notAuthorized('Log in with an admin account to view this page.'); return; }

    const { data: profile, error: profileErr } = await supabaseClient
      .from('profiles').select('role').eq('id', sessionData.session.user.id).maybeSingle();
    if (profileErr || !profile || profile.role !== 'admin') {
      notAuthorized('This page is only visible to the site admin.');
      return;
    }

    const [{ data: attempts, error: attemptsErr }, { data: profiles, error: profilesErr }] = await Promise.all([
      supabaseClient.from('test_attempts').select('*').order('completed_at', { ascending: false }),
      supabaseClient.from('profiles').select('id, email, role, is_premium, created_at'),
    ]);
    if (attemptsErr || profilesErr) {
      content.innerHTML = '<div class="gate-note"><h2>Couldn\'t load data</h2><p>' +
        escapeHtml((attemptsErr || profilesErr).message) + '</p></div>';
      return;
    }

    const emailById = {};
    profiles.forEach((p) => { emailById[p.id] = p.email; });

    const totalUsers = profiles.length;
    const totalAttempts = attempts.length;
    const avgPct = totalAttempts
      ? Math.round(attempts.reduce((s, a) => s + (a.total ? a.score / a.total : 0), 0) / totalAttempts * 100)
      : 0;

    let html = '<div class="page-wrap"><h1>Admin Dashboard</h1><p class="page-sub">All registered users and test activity.</p>';
    html += '<div class="summary-row">' +
      '<div class="stat-box"><div class="num">' + totalUsers + '</div><div class="lbl">Registered users</div></div>' +
      '<div class="stat-box"><div class="num">' + totalAttempts + '</div><div class="lbl">Tests completed</div></div>' +
      '<div class="stat-box"><div class="num">' + avgPct + '%</div><div class="lbl">Average score</div></div>' +
      '</div>';

    html += '<h2 style="font-size:16px;margin:0 0 12px;color:var(--subtext);text-transform:uppercase;letter-spacing:.4px;font-weight:800">Registered users</h2>';
    html += '<table class="data-table" style="margin-bottom:34px"><thead><tr><th>Email</th><th>Role</th><th>Premium</th><th>Joined</th><th></th></tr></thead><tbody>';
    profiles.forEach((p) => {
      html += '<tr><td>' + escapeHtml(p.email) + '</td><td>' + escapeHtml(p.role) + '</td>' +
        '<td><span class="score-pill ' + (p.is_premium ? 'good' : 'low') + '">' + (p.is_premium ? 'Yes' : 'No') + '</span></td>' +
        '<td>' + fmtDate(p.created_at) + '</td>' +
        '<td><button class="btn-logout premium-toggle" data-id="' + p.id + '" data-current="' + (p.is_premium ? '1' : '0') + '" type="button">' +
        (p.is_premium ? 'Revoke Premium' : 'Grant Premium') + '</button></td></tr>';
    });
    html += '</tbody></table>';

    html += '<h2 style="font-size:16px;margin:0 0 12px;color:var(--subtext);text-transform:uppercase;letter-spacing:.4px;font-weight:800">All test attempts</h2>';
    if (!totalAttempts) {
      html += '<div class="gate-note"><h2>No attempts yet</h2><p>Once users start completing tests while logged in, they\'ll show up here.</p></div>';
    } else {
      html += '<table class="data-table"><thead><tr><th>User</th><th>Test</th><th>Section</th><th>Score</th><th>Date</th></tr></thead><tbody>';
      attempts.forEach((a) => {
        html += '<tr><td>' + escapeHtml(emailById[a.user_id] || a.user_id) + '</td>' +
          '<td>' + escapeHtml(a.test_title || a.test_path) + '</td>' +
          '<td>' + escapeHtml(a.section || '') + '</td>' +
          '<td><span class="score-pill ' + scoreClass(a.score, a.total) + '">' + a.score + ' / ' + a.total + '</span></td>' +
          '<td>' + fmtDate(a.completed_at) + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    content.innerHTML = html;

    content.querySelectorAll('.premium-toggle').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const nextValue = btn.dataset.current !== '1';
        btn.disabled = true; btn.textContent = 'Saving…';
        const { error } = await supabaseClient.from('profiles').update({ is_premium: nextValue }).eq('id', id);
        if (error) {
          btn.disabled = false; btn.textContent = 'Failed — retry';
          console.error(error);
          return;
        }
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
